# Shop im HugoSMP-Look. Hauptmenü: 3 Reihen, Kategorien mittig (Slots 11-15), kein Füll-Glas.
# Unterseiten: Titel in Cyan, bis zu 9 Items in der mittleren Reihe (mehr = automatisch weitere Seiten),
# rote Glasscheibe unten mittig = Zurück.
# buy = Kaufpreis pro Stück (0 = nicht kaufbar), sell = Verkaufspreis (0 = nicht verkaufbar)
# action: crystalstore = diese Kategorie öffnet den Stars-Shop (Nether Star)
# locked: true = nur Anzeige (gesperrt, z.B. Barrier), slot = Position im Hauptmenü (0-26)
# sell-only: Items, die man verkaufen (/sell, /sell hand, /sell all, Verkaufs-Menü), aber NICHT im Shop kaufen kann.
# Sie erscheinen nicht im Shop-Menü. Format:  MATERIAL: Verkaufspreis pro Stück
# Weitere Items einfach unten anhängen (Materialnamen: https://jd.papermc.io/paper/1.21.4/org/bukkit/Material.html)
